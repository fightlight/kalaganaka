name: Release notes

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_NOTES: ${{ runner.temp }}/release-notes.md
    steps:
      - name: Check out the tagged commit and release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag):
              raise SystemExit(f"Expected a stable version tag vMAJOR.MINOR.PATCH, got {tag}")
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match workspace version {version}")
          PY

      - name: Generate notes for this release
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: ${{ env.RELEASE_NOTES }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RELEASE_NOTES"
