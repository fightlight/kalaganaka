# One changelog for the application and its workspace crates.
[changelog]
header = """
# Changelog

Generated from Git commits using git-cliff. Do not edit entries by hand.
Unreleased entries include committed changes only.

"""
body = """
{% if version %}\
## [{{ version }}](https://github.com/fightlight/kalaganaka/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/fightlight/kalaganaka/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Preserve the existing initial commits and future nonconventional messages.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
topo_order = true
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^revert", group = "<!-- 3 -->Reverts" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(refactor|style|test|build|ci|chore)", group = "<!-- 5 -->Maintenance" },
    { message = ".*", group = "<!-- 6 -->Other changes" },
]
